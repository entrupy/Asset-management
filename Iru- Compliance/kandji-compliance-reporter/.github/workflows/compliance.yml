name: Kandji Compliance Report

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

jobs:
  compliance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run compliance report
        env:
          KANDJI_API_TOKEN: ${{ secrets.KANDJI_API_TOKEN }}
          KANDJI_API_BASE_URL: ${{ vars.KANDJI_API_BASE_URL }}
          KANDJI_DEVICE_ENDPOINT: ${{ vars.KANDJI_DEVICE_ENDPOINT }}
          CHECK_IN_DAYS: ${{ vars.CHECK_IN_DAYS }}
          MIN_MACOS_VERSION: ${{ vars.MIN_MACOS_VERSION }}
          REQUIRED_APPLICATIONS: ${{ vars.REQUIRED_APPLICATIONS }}
        run: python main.py

      - name: Upload CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: kandji-compliance-report
          path: reports/*.csv
          if-no-files-found: warn
